apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production
namePrefix: prod-

resources:
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/part-of: storefront
    includeSelectors: false

images:
  - name: ghcr.io/example/web
    newTag: 1.4.3

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 4
